name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  platform-packages:
    name: Platform Skill And MCP Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check file integrity
        run: python3 scripts/check_file_integrity.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --locked --dev

      - name: Generate platform packages
        working-directory: apps/api
        run: uv run python ../../scripts/generate_platform_packages.py

      - name: Check catalog locks
        working-directory: apps/api
        run: uv run python ../../scripts/check_catalog_locks.py --json --require-generated

      - name: Check agent registry
        working-directory: apps/api
        run: uv run python ../../scripts/check_agent_registry.py --json

      - name: Run agent evals
        working-directory: apps/api
        run: uv run python ../../scripts/run_agent_evals.py

      - name: Verify release ledger
        working-directory: apps/api
        run: uv run python ../../scripts/record_release.py verify

      - name: Validate platform package contracts
        working-directory: apps/api
        run: uv run python ../../scripts/test_platform_packages.py

      - name: Run package and MCP tests
        working-directory: apps/api
        run: >-
          uv run pytest
          tests/unit/test_platform_package_builder.py
          tests/unit/test_platform_package_generation.py
          tests/unit/test_provider_status.py
          tests/unit/test_mcp_governance.py
          tests/unit/test_mcp_runtime.py
          tests/unit/test_mcp_auth.py
          tests/unit/test_mcp_transport_security.py
          -q

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build scraper console
        env:
          NEXT_PUBLIC_API_URL: "https://scrapy.luteos.com"
        run: pnpm -C apps/scraper-console build

  api:
    name: API Quality Gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check file integrity
        working-directory: .
        run: python3 scripts/check_file_integrity.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify CI has no unscoped real API E2E
        working-directory: .
        run: python3 scripts/verify-ci-no-unscoped-real-e2e.py

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install API dependencies
        run: uv sync --locked --dev

      - name: Test production preflight scripts
        working-directory: .
        run: |
          bash scripts/tests/test-preflight-production.sh
          bash scripts/tests/test-deploy-p0-preflight.sh

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy (non-regression)
        run: uv run python ../../scripts/check_mypy_baseline.py --baseline ../../configs/quality/mypy-src-tests-signatures.txt --path src --path tests

      - name: Generate platform packages
        run: uv run python ../../scripts/generate_platform_packages.py

      - name: Pytest
        run: uv run pytest tests/unit

      - name: Pytest regression guard (unit scope)
        run: uv run python ../../scripts/check_pytest_baseline.py --path tests/unit

      - name: Alembic head check
        run: uv run alembic heads

  workflow-planner-postgres:
    name: Workflow Planner PostgreSQL 15 Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: data_scrapy_workflow_plan_phase2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d data_scrapy_workflow_plan_phase2_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check file integrity
        run: python3 scripts/check_file_integrity.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --locked --dev

      - name: Run guarded workflow planner PostgreSQL gate
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/data_scrapy_workflow_plan_phase2_test
          ALLOW_DESTRUCTIVE_MIGRATION_TEST: "true"
        run: bash scripts/verify-workflow-planner-phase2-migration.sh

  workflow-lineage-postgres:
    name: Workflow Lineage PostgreSQL 15 Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: data_scrapy_ci_workflow_lineage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d data_scrapy_ci_workflow_lineage_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check file integrity
        run: python3 scripts/check_file_integrity.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --locked --dev

      - name: Run guarded workflow lineage PostgreSQL gate
        env:
          WORKFLOW_LINEAGE_POSTGRES_TEST_AUTHORIZED: "true"
          WORKFLOW_LINEAGE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/data_scrapy_ci_workflow_lineage_test
          WORKFLOW_LINEAGE_AUTHORIZED_TARGET: 127.0.0.1:5432/data_scrapy_ci_workflow_lineage_test
        run: bash scripts/verify-workflow-lineage-migration.sh

  web:
    name: Web Quality Gate
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_MOCK_API: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm -C apps/web lint

      - name: Vitest
        run: pnpm -C apps/web test

      - name: Next.js build
        run: pnpm -C apps/web build

      - name: Next.js production API build guard
        env:
          NEXT_PUBLIC_API_URL: "https://scrapy.lute-tlz-dddd.top"
          NEXT_PUBLIC_MOCK_API: "false"
        run: pnpm -C apps/web build

      - name: Install Playwright Chromium
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: Playwright E2E
        run: pnpm -C apps/web test:e2e

  # 真实链路门禁。见 docs/architecture/decisions/ADR-008-real-chain-e2e-gate.md
  #
  # 与上面的 Web Quality Gate 互补而不重叠：那个 gate 在 mock 下验证页面行为，
  # 这个 gate 验证「登录 → 选业务域 → 真实记录 → 洞察 → 证据 → 报告」这条链
  # 真的走了服务端。mock 分支在 API 模块里提前 return、不发 HTTP，
  # 所以只有这里能证明这条链没断。
  #
  # 目标固定 loopback：一次性栈在 runner 上起，down -v 清零。
  # verify-ci-no-unscoped-real-e2e.py 会正向校验这两点，改坏了会红。
  web-real-chain-e2e:
    name: Web Real Chain E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      # 起栈、跑 spec、down -v 全在脚本里；脚本用 trap 保证失败时也清理。
      - name: Bring up disposable stack and run real chain spec
        env:
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:8090"
        run: bash scripts/verify-real-chain-e2e.sh

      # 脚本已自带 trap 清理；这一层兜底用于脚本自身被信号杀掉的情况。
      - name: Tear down disposable stack
        if: always()
        run: bash scripts/e2e-real-stack.sh down || true

  console-routes-e2e:
    name: Console Route E2E (non-blocking)
    runs-on: ubuntu-latest
    # 在稳定的 API fixture 出现前保持非阻塞。
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm -C apps/scraper-console exec playwright install --with-deps chromium

      - name: Prepare optional authenticated state
        env:
          CONSOLE_E2E_STORAGE_STATE_JSON: ${{ secrets.CONSOLE_E2E_STORAGE_STATE_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${CONSOLE_E2E_STORAGE_STATE_JSON:-}" ]; then
            storage_state_path="${RUNNER_TEMP}/console-storage-state.json"
            printf '%s' "$CONSOLE_E2E_STORAGE_STATE_JSON" > "$storage_state_path"
            echo "PLAYWRIGHT_STORAGE_STATE=$storage_state_path" >> "$GITHUB_ENV"
            echo "Authenticated route assertions are enabled."
          else
            echo "No CONSOLE_E2E_STORAGE_STATE_JSON secret. Authenticated route assertions are disabled."
          fi

      - name: Start console on port 3001
        working-directory: apps/scraper-console
        env:
          CONSOLE_E2E_API_URL: ${{ vars.CONSOLE_E2E_API_URL }}
        run: |
          set -euo pipefail
          if [ -n "${CONSOLE_E2E_API_URL:-}" ]; then
            echo "Building console against dedicated API: ${CONSOLE_E2E_API_URL}"
            NEXT_PUBLIC_API_URL="${CONSOLE_E2E_API_URL}" pnpm exec next build
            NEXT_PUBLIC_API_URL="${CONSOLE_E2E_API_URL}" nohup pnpm exec next start --port 3001 > /tmp/console-e2e.log 2>&1 &
          else
            echo "No dedicated API configured. Starting next dev; API-backed assertions will be skipped."
            NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}" \
              nohup pnpm exec next dev --port 3001 > /tmp/console-e2e.log 2>&1 &
          fi

          for attempt in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:3001/login; then
              echo "Console ready after $attempt attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "Console did not become ready."
          cat /tmp/console-e2e.log
          exit 1

      - name: Run route and redirect E2E
        working-directory: apps/scraper-console
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
          CONSOLE_E2E_API_URL: ${{ vars.CONSOLE_E2E_API_URL }}
        run: |
          set -euo pipefail
          if [ -n "${CONSOLE_E2E_API_URL:-}" ] && [ -n "${PLAYWRIGHT_STORAGE_STATE:-}" ]; then
            pnpm exec playwright test
          else
            echo "API-backed assertions are skipped: configure CONSOLE_E2E_API_URL and CONSOLE_E2E_STORAGE_STATE_JSON to enable them."
            pnpm exec playwright test --grep-invert @authenticated
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-playwright-report
          path: |
            tmp/playwright-console-report/
            tmp/playwright-console-results/
          if-no-files-found: ignore
          retention-days: 7
