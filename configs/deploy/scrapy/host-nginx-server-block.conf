upstream data_achieve_scrapy {
    server data_achieve_scrapy_proxy:8080;
}

server {
    listen 443 ssl;
    http2 on;
    server_name scrapy.lute-tlz-dddd.top;

    ssl_certificate /etc/letsencrypt/live/scrapy.lute-tlz-dddd.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scrapy.lute-tlz-dddd.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 同步采集入口放宽到 30 分钟（精确匹配优先于下面的 location /）。
    # 平台另有 MCP 路径（/mcp/，3600s）承担更长的任务，两条都保留。
    location = /api/quick-collect {
        proxy_pass http://data_achieve_scrapy;
        include /etc/nginx/proxy_params.conf;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1800s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://data_achieve_scrapy;
        include /etc/nginx/proxy_params.conf;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
