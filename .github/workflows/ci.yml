name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  api:
    name: API Quality Gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install API dependencies
        run: uv sync --locked --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src tests

      - name: Pytest
        run: uv run pytest

      - name: Alembic head check
        run: uv run alembic heads

  web:
    name: Web Quality Gate
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_MOCK_API: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm -C apps/web lint

      - name: Vitest
        run: pnpm -C apps/web test

      - name: Next.js build
        run: pnpm -C apps/web build

      - name: Install Playwright Chromium
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: Playwright E2E
        run: pnpm -C apps/web test:e2e
