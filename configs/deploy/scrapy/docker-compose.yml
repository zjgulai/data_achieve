name: data_achieve_scrapy

services:
  db:
    container_name: data_achieve_scrapy_db
    environment:
      POSTGRES_DB: ${SCRAPY_POSTGRES_DB:?SCRAPY_POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${SCRAPY_POSTGRES_PASSWORD:?SCRAPY_POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${SCRAPY_POSTGRES_USER:?SCRAPY_POSTGRES_USER is required}
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    image: postgres:16
    restart: unless-stopped
    volumes:
      - scrapy_postgres_data:/var/lib/postgresql/data
    networks:
      - scrapy_internal

  export-init:
    command:
      [
        "sh",
        "-c",
        "mkdir -p /app/exports/datasets && chown -R app:app /app/exports",
      ]
    container_name: data_achieve_scrapy_export_init
    image: data_achieve_scrapy_api:latest
    networks:
      - scrapy_internal
    restart: "no"
    user: root
    volumes:
      - scrapy_export_data:/app/exports

  api:
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile
      # playwright_browser_* 需要镜像内带 Chromium；默认不带，端点会报
      # playwright_not_installed。这里显式打开（镜像会大 ~400MB）。
      args:
        INSTALL_PLAYWRIGHT: ${SCRAPY_INSTALL_PLAYWRIGHT:-true}
        INSTALL_OSINT: ${SCRAPY_INSTALL_OSINT:-false}
    container_name: data_achieve_scrapy_api
    depends_on:
      db:
        condition: service_healthy
      export-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      AUTH_COOKIE_SECURE: ${SCRAPY_AUTH_COOKIE_SECURE:-true}
      CORS_ORIGINS: '["${SCRAPY_PUBLIC_URL:-https://scrapy.luteos.com}"]'
      DATABASE_URL: postgresql+asyncpg://${SCRAPY_POSTGRES_USER:?SCRAPY_POSTGRES_USER is required}:${SCRAPY_POSTGRES_PASSWORD:?SCRAPY_POSTGRES_PASSWORD is required}@db:5432/${SCRAPY_POSTGRES_DB:?SCRAPY_POSTGRES_DB is required}
      JWT_SECRET: ${SCRAPY_JWT_SECRET:?SCRAPY_JWT_SECRET is required}
      DATASET_EXPORT_DIR: ${SCRAPY_DATASET_EXPORT_DIR:-/app/exports/datasets}
      LLM_PROVIDER: mock
      LOG_LEVEL: INFO
      SCHEDULER_ENABLED: ${SCRAPY_SCHEDULER_ENABLED:-false}
      SCHEDULER_POLL_INTERVAL_SECONDS: ${SCRAPY_SCHEDULER_POLL_INTERVAL_SECONDS:-60}
      SMTP_FROM: ${SCRAPY_SMTP_FROM:-}
      SMTP_HOST: ${SCRAPY_SMTP_HOST:-}
      SMTP_PASSWORD: ${SCRAPY_SMTP_PASSWORD:-}
      SMTP_PORT: ${SCRAPY_SMTP_PORT:-587}
      SMTP_USER: ${SCRAPY_SMTP_USER:-}
      TIKHUB_API_KEY: ${TIKHUB_API_KEY:-}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      ANYSEARCH_API_KEY: ${ANYSEARCH_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
      BESTBLOGS_API_KEY: ${BESTBLOGS_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BLACKBIRD_BASE_URL: ${BLACKBIRD_BASE_URL:-}
      TWITTER_ACCOUNTS_JSON: ${TWITTER_ACCOUNTS_JSON:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PLATFORM_CREDENTIAL_MASTER_KEY: ${PLATFORM_CREDENTIAL_MASTER_KEY:-}
      LARK_CDO_APP_ID: ${LARK_CDO_APP_ID:-}
      LARK_CDO_APP_SECRET: ${LARK_CDO_APP_SECRET:-}
      LARK_CDO_VERIFICATION_TOKEN: ${LARK_CDO_VERIFICATION_TOKEN:-}
      LARK_CDO_PROJECT_ID: ${LARK_CDO_PROJECT_ID:-7fd6ed55-7b0c-5482-92f3-d03130168b70}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      INTERNAL_API_BASE: ${INTERNAL_API_BASE:-http://127.0.0.1:8000}
      SCRAPY_MCP_TOKEN: ${SCRAPY_MCP_TOKEN:-}
      SCRAPY_MCP_TOKENS_JSON: ${SCRAPY_MCP_TOKENS_JSON:-{}}
      SCRAPY_MCP_RATE_PER_MINUTE: ${SCRAPY_MCP_RATE_PER_MINUTE:-120}
      SCRAPY_MCP_CONCURRENT_CALLS: ${SCRAPY_MCP_CONCURRENT_CALLS:-8}
      SCRAPY_MCP_DAILY_COLLECTS: ${SCRAPY_MCP_DAILY_COLLECTS:-500}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      PROXY_ROTATOR_URL: ${PROXY_ROTATOR_URL:-http://proxy_rotator:8080}
      PROXY_ROTATOR_ENABLED: ${PROXY_ROTATOR_ENABLED:-false}
      MAIGRET_URL: ${MAIGRET_URL:-http://maigret:5000}
      SPIDERFOOT_BASE_URL: ${SPIDERFOOT_BASE_URL:-http://spiderfoot:5001}
      SPIDERFOOT_TIMEOUT: ${SPIDERFOOT_TIMEOUT:-300}
    expose:
      - "8000"
    volumes:
      - scrapy_export_data:/app/exports
      - browser_data:/app/browser_data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    image: data_achieve_scrapy_api:latest
    restart: unless-stopped
    networks:
      - scrapy_internal

  web:
    build:
      context: ../../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${SCRAPY_PUBLIC_URL:-https://scrapy.luteos.com}
        NEXT_PUBLIC_MOCK_API: "false"
    container_name: data_achieve_scrapy_web
    image: data_achieve_scrapy_web:latest
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/tasks').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - scrapy_internal

  console:
    build:
      context: ../../..
      dockerfile: apps/scraper-console/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${SCRAPY_PUBLIC_URL:-https://scrapy.luteos.com}
    container_name: data_achieve_scrapy_console
    image: data_achieve_scrapy_console:latest
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3001"
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/platforms').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - scrapy_internal

  # Mubeng Proxy Rotator - P0 Infrastructure
  proxy_rotator:
    container_name: data_achieve_scrapy_proxy_rotator
    image: kitabisa/mubeng:latest
    profiles:
      - proxy
    command: ["-a", "0.0.0.0:8080", "-f", "/proxies.txt", "-r", "30", "-v"]
    volumes:
      - ./proxies.txt:/proxies.txt:ro
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - scrapy_internal

  # Maigret OSINT Service - P0 OSINT Layer
  maigret:
    container_name: data_achieve_scrapy_maigret
    image: soxoj/maigret:latest
    command: ["--web", "5000"]
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - scrapy_internal

  # SpiderFoot OSINT Platform - P0 Enterprise OSINT (200+ modules)
  spiderfoot-real:
    container_name: data_achieve_scrapy_spiderfoot_real
    image: crivellarodiego/spiderfoot:latest
    command: ["sf.py", "-l", "0.0.0.0:5001"]
    expose:
      - "5001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5001 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - scrapy_internal

  spiderfoot:
    container_name: data_achieve_scrapy_spiderfoot
    build:
      context: ../../../configs/bridges/spiderfoot-bridge
      dockerfile: Dockerfile
    image: spiderfoot_bridge:latest
    environment:
      SF_UPSTREAM: http://data_achieve_scrapy_spiderfoot_real:5001
    expose:
      - "5001"
    restart: unless-stopped
    depends_on:
      spiderfoot-real:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/api/v1/scanlist', timeout=3)\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - scrapy_internal

  edge:
    container_name: data_achieve_scrapy_edge
    depends_on:
      api:
        condition: service_healthy
      console:
        condition: service_healthy
    expose:
      - "8080"
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./edge-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/platforms >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      scrapy_internal:
      lighthouse_ai_video_net:
        aliases:
          - data_achieve_scrapy_proxy

networks:
  scrapy_internal:
    name: data_achieve_scrapy_internal
    driver: bridge
  lighthouse_ai_video_net:
    external: true

volumes:
  scrapy_postgres_data:
    name: data_achieve_scrapy_postgres_data
  scrapy_export_data:
    name: data_achieve_scrapy_export_data
  browser_data:
    name: data_achieve_scrapy_browser_data
