name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: "Real API base URL for optional regression run"
        required: false
        default: "https://scrapy.lute-tlz-dddd.top"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  api:
    name: API Quality Gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install API dependencies
        run: uv sync --locked --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src tests

      - name: Pytest
        run: uv run pytest

      - name: Alembic head check
        run: uv run alembic heads

  web:
    name: Web Quality Gate
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_MOCK_API: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm -C apps/web lint

      - name: Vitest
        run: pnpm -C apps/web test

      - name: Next.js build
        run: pnpm -C apps/web build

      - name: Next.js production API build guard
        env:
          NEXT_PUBLIC_API_URL: "https://scrapy.lute-tlz-dddd.top"
          NEXT_PUBLIC_MOCK_API: "false"
        run: pnpm -C apps/web build

      - name: Install Playwright Chromium
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: Playwright E2E
        run: pnpm -C apps/web test:e2e

  web-real-e2e:
    name: Web Real API E2E (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: Create isolated real API user
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
        run: |
          set -euo pipefail
          e2e_email="e2e-$(date +%s)-$RANDOM@example.com"
          e2e_password="Pw$(openssl rand -hex 18)"
          BASE_URL="$BASE_URL" E2E_EMAIL="$e2e_email" E2E_PASSWORD="$e2e_password" node <<'NODE'
          const baseUrl = process.env.BASE_URL;
          const email = process.env.E2E_EMAIL;
          const password = process.env.E2E_PASSWORD;
          const register = await fetch(`${baseUrl}/api/auth/register`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ email, password, name: "CI Real E2E User" }),
          });
          if (!register.ok) {
            throw new Error(`register failed ${register.status}: ${await register.text()}`);
          }
          const cookie = register.headers.get("set-cookie")?.split(";")[0];
          if (!cookie) {
            throw new Error("register did not return auth cookie");
          }
          const project = await fetch(`${baseUrl}/api/projects`, {
            method: "POST",
            headers: { "content-type": "application/json", cookie },
            body: JSON.stringify({
              name: "CI Real E2E OSINT Workspace",
              description: "Isolated project for real API E2E verification.",
              domain: "osint",
            }),
          });
          if (!project.ok) {
            throw new Error(`project failed ${project.status}: ${await project.text()}`);
          }
          NODE
          {
            echo "SCRAPY_DEMO_EMAIL=$e2e_email"
            echo "SCRAPY_DEMO_PASSWORD=$e2e_password"
          } >> "$GITHUB_ENV"

      - name: Playwright Real API E2E
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url }}
          PLAYWRIGHT_REAL_API: "true"
        run: pnpm -C apps/web test:e2e:real
