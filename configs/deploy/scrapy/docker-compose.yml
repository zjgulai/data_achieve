name: data_achieve_scrapy

services:
  db:
    container_name: data_achieve_scrapy_db
    environment:
      POSTGRES_DB: ${SCRAPY_POSTGRES_DB:?SCRAPY_POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${SCRAPY_POSTGRES_PASSWORD:?SCRAPY_POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${SCRAPY_POSTGRES_USER:?SCRAPY_POSTGRES_USER is required}
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    image: postgres:16
    restart: unless-stopped
    volumes:
      - scrapy_postgres_data:/var/lib/postgresql/data
    networks:
      - scrapy_internal

  export-init:
    command:
      [
        "sh",
        "-c",
        "mkdir -p /app/exports/datasets && chown -R app:app /app/exports",
      ]
    container_name: data_achieve_scrapy_export_init
    image: data_achieve_scrapy_api:latest
    networks:
      - scrapy_internal
    restart: "no"
    user: root
    volumes:
      - scrapy_export_data:/app/exports

  # ABI 迁移一次性作业。与 api 同镜像，跑完 alembic upgrade head 即退出。
  # restart: "no" 是刻意的：迁移失败要让部署脚本看到非零退出码，
  # 不能被重启策略无限重试掩盖。user root 与 export-init 同为一次性运维作业。
  # ABI 三个服务都不监听端口：expose 为空，且绝不声明 ports。
  abi-migrate:
    image: data_achieve_scrapy_api:latest
    container_name: data_achieve_scrapy_abi_migrate
    # 用 profiles 把它挡在默认 up 之外。
    # abi-migrate 是一次性作业，不带服务名的 `up -d` 每次都重跑迁移；
    # worker 也不该随主发布启动：按需用 --profile abi 拉起。
    # 启用方式：docker compose --profile abi up -d
    profiles: ["abi"]
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${SCRAPY_POSTGRES_USER:?SCRAPY_POSTGRES_USER is required}:${SCRAPY_POSTGRES_PASSWORD:?SCRAPY_POSTGRES_PASSWORD is required}@db:5432/${SCRAPY_POSTGRES_DB:?SCRAPY_POSTGRES_DB is required}
    expose: []
    networks:
      - scrapy_internal
    restart: "no"
    user: root

  # ABI 摄取 worker。常驻进程，02:15（Asia/Shanghai）入队 T-1 scan。
  #
  # 环境只给 ABI 自己需要的键：DATABASE_URL、ABI_FERNET_KEY 与 TZ。
  # JWT_SECRET / PLATFORM_CREDENTIAL_MASTER_KEY / LARK / LLM 一律不继承：
  # 这个容器不服务 HTTP，拿到它们只会扩大泄露面。
  #
  # 资源上限按方案 §4：mem 3g、cpus 2.0、pids 512。导出另起容器，
  # 避免 02:14 的大导出把 ingest OOM，直接丢掉 T-1 窗口。
  abi-ingest:
    image: data_achieve_scrapy_api:latest
    container_name: data_achieve_scrapy_abi_ingest
    # 用 profiles 把它挡在默认 up 之外。
    # abi-migrate 是一次性作业，不带服务名的 `up -d` 每次都重跑迁移；
    # worker 也不该随主发布启动：按需用 --profile abi 拉起。
    # 启用方式：docker compose --profile abi up -d
    profiles: ["abi"]
    command: ["python", "-m", "data_intelligence_hub.abi.ingest"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${SCRAPY_POSTGRES_USER:?SCRAPY_POSTGRES_USER is required}:${SCRAPY_POSTGRES_PASSWORD:?SCRAPY_POSTGRES_PASSWORD is required}@db:5432/${SCRAPY_POSTGRES_DB:?SCRAPY_POSTGRES_DB is required}
      ABI_FERNET_KEY: ${ABI_FERNET_KEY:-}
      TZ: Asia/Shanghai
    expose: []
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 512
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - scrapy_internal

  # ABI 导出 worker。与 ingest 分开成容器：导出峰值内存独立计量，
  # 1g 上限把最坏情况限制在导出容器内。只给 DATABASE_URL。
  # 导出目录挂在 scrapy_export_data 上，必须先等 export-init 完成 chown。
  # command 用 ingest 模块的 --role export：该角色每个 tick 领一批 queued
  # 作业，逐个独立事务执行；遮罩与路径校验在 abi_export.run_job 内。
  #
  # **不带 profile：异步导出是用户可见功能，必须随发布启动。**
  # 此前它挂在 profiles: ["abi"] 下，而 deploy-p0.sh 从不带该 profile，
  # 于是生产上从来没有 worker 在跑。后果不是"功能未启用"而是**静默失败**：
  # 用户提交导出、审批人批准、作业进入 queued，然后永远停在 queued，
  # 界面显示"排队中"，没有任何错误。同步路径（create_abi_export 自己
  # 渲染）掩盖了这一点——遮罩导出走的正是同步，看起来一切正常。
  #
  # abi-ingest 仍留在 profile 外：它读的是 Apify 账号表，消费逻辑尚未
  # 实现，启动它只会每分钟写一次心跳。
  abi-export:
    image: data_achieve_scrapy_api:latest
    container_name: data_achieve_scrapy_abi_export
    command:
      ["python", "-m", "data_intelligence_hub.abi.ingest", "--role", "export"]
    depends_on:
      db:
        condition: service_healthy
      export-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://${SCRAPY_POSTGRES_USER:?SCRAPY_POSTGRES_USER is required}:${SCRAPY_POSTGRES_PASSWORD:?SCRAPY_POSTGRES_PASSWORD is required}@db:5432/${SCRAPY_POSTGRES_DB:?SCRAPY_POSTGRES_DB is required}
    expose: []
    mem_limit: 1g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      - scrapy_export_data:/app/exports
    networks:
      - scrapy_internal

  api:
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile
      # playwright_browser_* 需要镜像内带 Chromium；默认不带，端点会报
      # playwright_not_installed。这里显式打开（镜像会大 ~400MB）。
      args:
        INSTALL_PLAYWRIGHT: ${SCRAPY_INSTALL_PLAYWRIGHT:-true}
        INSTALL_OSINT: ${SCRAPY_INSTALL_OSINT:-false}
        # 构建期镜像源：默认官方源，生产 B 靠 .env.production 的 SCRAPY_* 键切换
        PIP_INDEX_URL: ${SCRAPY_PIP_INDEX_URL:-https://pypi.org/simple}
        UV_DEFAULT_INDEX: ${SCRAPY_PIP_INDEX_URL:-https://pypi.org/simple}
        DEBIAN_MIRROR: ${SCRAPY_DEBIAN_MIRROR:-}
        PLAYWRIGHT_DOWNLOAD_HOST: ${SCRAPY_PLAYWRIGHT_DOWNLOAD_HOST:-}
    container_name: data_achieve_scrapy_api
    depends_on:
      db:
        condition: service_healthy
      export-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      AUTH_COOKIE_SECURE: ${SCRAPY_AUTH_COOKIE_SECURE:-true}
      CORS_ORIGINS: '["${SCRAPY_PUBLIC_URL:-https://scrapy.luteos.com}"]'
      DATABASE_URL: postgresql+asyncpg://${SCRAPY_POSTGRES_USER:?SCRAPY_POSTGRES_USER is required}:${SCRAPY_POSTGRES_PASSWORD:?SCRAPY_POSTGRES_PASSWORD is required}@db:5432/${SCRAPY_POSTGRES_DB:?SCRAPY_POSTGRES_DB is required}
      JWT_SECRET: ${SCRAPY_JWT_SECRET:?SCRAPY_JWT_SECRET is required}
      DATASET_EXPORT_DIR: ${SCRAPY_DATASET_EXPORT_DIR:-/app/exports/datasets}
      LLM_PROVIDER: mock
      LOG_LEVEL: INFO
      SCHEDULER_ENABLED: ${SCRAPY_SCHEDULER_ENABLED:-false}
      SCHEDULER_POLL_INTERVAL_SECONDS: ${SCRAPY_SCHEDULER_POLL_INTERVAL_SECONDS:-60}
      # 持久运行队列 worker。生产默认开启，进程会领取 runs 表的 queued 行。
      RUN_WORKER_ENABLED: ${SCRAPY_RUN_WORKER_ENABLED:-true}
      # 外访策略。见 docs/standards/collection-outbound-safety.md。
      # 默认值必须写 :-[]。未设置或空串会让 pydantic-settings 解析失败。
      # 这两个键必须在本列表里声明；只写 .env.production 不会进容器。
      COLLECTION_NETWORK_MODE: ${COLLECTION_NETWORK_MODE:-restricted}
      COLLECTION_HTTP_GRANTS: ${COLLECTION_HTTP_GRANTS:-[]}
      SMTP_FROM: ${SCRAPY_SMTP_FROM:-}
      SMTP_HOST: ${SCRAPY_SMTP_HOST:-}
      SMTP_PASSWORD: ${SCRAPY_SMTP_PASSWORD:-}
      SMTP_PORT: ${SCRAPY_SMTP_PORT:-587}
      SMTP_USER: ${SCRAPY_SMTP_USER:-}
      TIKHUB_API_KEY: ${TIKHUB_API_KEY:-}
      TIKHUB_TIKTOK_CREATOR_COOKIE: ${TIKHUB_TIKTOK_CREATOR_COOKIE:-}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      ANYSEARCH_API_KEY: ${ANYSEARCH_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
      BESTBLOGS_API_KEY: ${BESTBLOGS_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BLACKBIRD_BASE_URL: ${BLACKBIRD_BASE_URL:-}
      TWITTER_ACCOUNTS_JSON: ${TWITTER_ACCOUNTS_JSON:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PLATFORM_CREDENTIAL_MASTER_KEY: ${PLATFORM_CREDENTIAL_MASTER_KEY:-}
      LARK_CDO_APP_ID: ${LARK_CDO_APP_ID:-}
      LARK_CDO_APP_SECRET: ${LARK_CDO_APP_SECRET:-}
      LARK_CDO_VERIFICATION_TOKEN: ${LARK_CDO_VERIFICATION_TOKEN:-}
      LARK_CDO_PROJECT_ID: ${LARK_CDO_PROJECT_ID:-7fd6ed55-7b0c-5482-92f3-d03130168b70}
      LARK_CDO_TOOL_ROUTING: ${LARK_CDO_TOOL_ROUTING:-hybrid}
      LARK_CDO_TOOL_ACTIONS: ${LARK_CDO_TOOL_ACTIONS:-search,hashtag,user_posts,creator,followers}
      LARK_CDO_TOOL_TIMEOUT_SECONDS: ${LARK_CDO_TOOL_TIMEOUT_SECONDS:-90}
      LARK_CDO_ENCRYPT_KEY: ${LARK_CDO_ENCRYPT_KEY:-}
      LARK_CDO_BITABLE_APP_TOKEN: ${LARK_CDO_BITABLE_APP_TOKEN:-}
      LARK_CDO_BITABLE_TABLE_ID: ${LARK_CDO_BITABLE_TABLE_ID:-}
      LARK_SHUSUO_APP_ID: ${LARK_SHUSUO_APP_ID:-}
      LARK_SHUSUO_APP_SECRET: ${LARK_SHUSUO_APP_SECRET:-}
      LARK_SHUSUO_VERIFICATION_TOKEN: ${LARK_SHUSUO_VERIFICATION_TOKEN:-}
      LARK_SHUSUO_ENCRYPT_KEY: ${LARK_SHUSUO_ENCRYPT_KEY:-}
      SHUSUO_DEFAULT_PROJECT_ID: ${SHUSUO_DEFAULT_PROJECT_ID:-08872350-5ac8-4487-832a-775825072108}
      SHUSUO_CONSOLE_BASE_URL: ${SHUSUO_CONSOLE_BASE_URL:-https://scrapy.luteos.com}
      SHUSUO_ALLOWED_OPEN_IDS: ${SHUSUO_ALLOWED_OPEN_IDS:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      INTERNAL_API_BASE: ${INTERNAL_API_BASE:-http://127.0.0.1:8000}
      SCRAPY_MCP_TOKEN: ${SCRAPY_MCP_TOKEN:-}
      SCRAPY_MCP_TOKENS_JSON: ${SCRAPY_MCP_TOKENS_JSON:-{}}
      SCRAPY_MCP_RATE_PER_MINUTE: ${SCRAPY_MCP_RATE_PER_MINUTE:-120}
      SCRAPY_MCP_CONCURRENT_CALLS: ${SCRAPY_MCP_CONCURRENT_CALLS:-8}
      SCRAPY_MCP_DAILY_COLLECTS: ${SCRAPY_MCP_DAILY_COLLECTS:-500}
      # MCP collect 与执行工具的端点级白名单（逗号分隔 endpoint_type）。
      # 留空 = 不限制（保持旧行为）。见 docs/ops/production-restart.md。
      SCRAPY_MCP_COLLECT_ALLOWED_ENDPOINTS: ${SCRAPY_MCP_COLLECT_ALLOWED_ENDPOINTS:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      TOR_PROXY_URL: ${TOR_PROXY_URL:-socks5h://tor:9050}
      PROXY_ROTATOR_URL: ${PROXY_ROTATOR_URL:-http://proxy_rotator:8080}
      PROXY_ROTATOR_ENABLED: ${PROXY_ROTATOR_ENABLED:-false}
      OBSCURA_CDP_URL: ${OBSCURA_CDP_URL:-}
      OBSCURA_CDP_TOKEN: ${OBSCURA_CDP_TOKEN:-}
      BROWSER_USE_BRIDGE_URL: ${BROWSER_USE_BRIDGE_URL:-http://browser-use:5002}
      BROWSER_USE_TIMEOUT: ${BROWSER_USE_TIMEOUT:-120}
      MAIGRET_URL: ${MAIGRET_URL:-http://maigret:5000}
      SPIDERFOOT_BASE_URL: ${SPIDERFOOT_BASE_URL:-http://spiderfoot:5001}
      # 子进程/轮询预算必须留在 nginx 的 quick-collect 上限（1800s）之内，
      # 否则请求会先被代理掐断，拿不到 API 的结构化错误。
      SPIDERFOOT_TIMEOUT: ${SPIDERFOOT_TIMEOUT:-1500}
      OSINT_PROC_TIMEOUT: ${OSINT_PROC_TIMEOUT:-800}
    expose:
      - "8000"
    volumes:
      - scrapy_export_data:/app/exports
      - browser_data:/app/browser_data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    image: data_achieve_scrapy_api:latest
    restart: unless-stopped
    networks:
      - scrapy_internal

  web:
    build:
      context: ../../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${SCRAPY_PUBLIC_URL:-https://scrapy.luteos.com}
        NEXT_PUBLIC_MOCK_API: "false"
        NEXT_PUBLIC_BASE_PATH: ${SCRAPY_WEB_BASE_PATH:-/insight}
        NPM_CONFIG_REGISTRY: ${SCRAPY_NPM_REGISTRY:-https://registry.npmjs.org/}
        COREPACK_NPM_REGISTRY: ${SCRAPY_NPM_REGISTRY:-https://registry.npmjs.org/}
    container_name: data_achieve_scrapy_web
    image: data_achieve_scrapy_web:latest
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      # 只给 healthcheck 用：basePath 是构建期常量，运行时再传一遍不改变
      # 路由行为，只是让探针知道该请求哪个前缀。两处必须同源。
      NEXT_PUBLIC_BASE_PATH: ${SCRAPY_WEB_BASE_PATH:-/insight}
    expose:
      - "3000"
    healthcheck:
      # basePath 生效后根路径 /tasks 不再由 Next 提供，探针必须带前缀。
      # 用运行时环境变量而不是硬编码 /insight：同一份编排在根部署下
      # （变量为空）仍探 /tasks，与引入 basePath 前完全一致。
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000'+process.env.NEXT_PUBLIC_BASE_PATH+'/tasks').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - scrapy_internal

  console:
    build:
      context: ../../..
      dockerfile: apps/scraper-console/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${SCRAPY_PUBLIC_URL:-https://scrapy.luteos.com}
        NPM_CONFIG_REGISTRY: ${SCRAPY_NPM_REGISTRY:-https://registry.npmjs.org/}
    container_name: data_achieve_scrapy_console
    image: data_achieve_scrapy_console:latest
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3001"
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/platforms').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - scrapy_internal

  # Mubeng Proxy Rotator - P0 Infrastructure
  proxy_rotator:
    container_name: data_achieve_scrapy_proxy_rotator
    image: kitabisa/mubeng:latest
    profiles:
      - proxy
    command: ["-a", "0.0.0.0:8080", "-f", "/proxies.txt", "-r", "30", "-v"]
    volumes:
      - ./proxies.txt:/proxies.txt:ro
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - scrapy_internal

  # Obscura CDP 浏览器后端，供 Playwright 与 browser-use 使用（ADR-002 阶段一）。
  #
  # 按需启用：用 `--profile obscura` 启动，并在 .env.production 同时设
  # OBSCURA_CDP_URL 与 OBSCURA_CDP_TOKEN。两个一起设或都不设——只设 URL 时，
  # 每次浏览器采集都要先付一次连不上的 CDP 连接，然后才降级。
  #
  # 以下每一条没注意都会让部署白跑一轮：
  #   - 上游子命令是 `serve`，没有 `server` 别名；镜像只在 Docker Hub，不在 GHCR。
  #   - OBSCURA_CDP_TOKEN 必须 ≥32 字节；绑非回环地址时缺它会直接启动失败。
  #   - 镜像是 distroless（无 shell、无 wget），CMD-SHELL 型 healthcheck 必然失败。
  #   - 官方镜像以 `--features render` 构建，所以这里的 --stealth 只给一致的浏览器
  #     指纹与 tracker 拦截；TLS 指纹仿冒要自建镜像（ADR-002 阶段二）。
  obscura:
    container_name: data_achieve_scrapy_obscura
    image: h4ckf0r0day/obscura:0.2.4
    command: ["serve", "--port", "9222", "--host", "0.0.0.0", "--stealth"]
    profiles:
      - obscura
    environment:
      OBSCURA_CDP_TOKEN: ${OBSCURA_CDP_TOKEN:-}
    expose:
      - "9222"
    restart: unless-stopped
    networks:
      - scrapy_internal

  # browser-use 桥：AI 浏览器 agent 单独成容器。
  #
  # browser-use 0.13.x 硬钉了一批依赖。装进 API 镜像会让锁文件从 207 包涨到
  # 400 包，并降级 18 个现有包（protobuf 7→6、websockets 16→15、requests、
  # rich、click、mcp 等）。所以它单独跑在这里，API 用 HTTP 调它，与 Maigret、
  # SpiderFoot 侧车同一形态。
  #
  # 需要 LLM 密钥：ANTHROPIC_API_KEY（默认 provider）或 OPENAI_API_KEY。
  # 设 OBSCURA_CDP_URL + OBSCURA_CDP_TOKEN 可让它改用 Obscura，不用自带的
  # Chromium；此时把 SCRAPY_BROWSER_USE_CHROMIUM 设为 false 可省约 400MB。
  #
  # 按需启用：镜像约 2.3GB（含 Chromium），且没有 LLM 密钥时它只会回报
  # degraded。所以挂在 `browser_use` profile 下——默认 `up -d` 不会构建它。
  # 启用：在 .env.production 设 ANTHROPIC_API_KEY，再
  #   docker compose --env-file ... --profile browser_use up -d --build browser-use
  browser-use:
    container_name: data_achieve_scrapy_browser_use
    profiles:
      - browser_use
    build:
      context: ../../../configs/bridges/browser-use-bridge
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${SCRAPY_PIP_INDEX_URL:-https://pypi.org/simple}
        PLAYWRIGHT_DOWNLOAD_HOST: ${SCRAPY_PLAYWRIGHT_DOWNLOAD_HOST:-}
        INSTALL_CHROMIUM: ${SCRAPY_BROWSER_USE_CHROMIUM:-true}
    image: browser_use_bridge:latest
    environment:
      BROWSER_USE_LLM_PROVIDER: ${BROWSER_USE_LLM_PROVIDER:-anthropic}
      BROWSER_USE_MODEL: ${BROWSER_USE_MODEL:-}
      BROWSER_USE_TASK_TIMEOUT: ${BROWSER_USE_TASK_TIMEOUT:-120}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OBSCURA_CDP_URL: ${OBSCURA_CDP_URL:-}
      OBSCURA_CDP_TOKEN: ${OBSCURA_CDP_TOKEN:-}
    expose:
      - "5002"
    restart: unless-stopped
    networks:
      - scrapy_internal

  # Maigret OSINT Service - P0 OSINT Layer
  tor:
    build:
      context: ./tor
    container_name: data_achieve_scrapy_tor
    restart: unless-stopped
    expose:
      - "9050"
    networks:
      - scrapy_internal

  maigret:
    container_name: data_achieve_scrapy_maigret
    image: soxoj/maigret:latest
    command: ["--web", "5000"]
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - scrapy_internal

  # SpiderFoot OSINT Platform - P0 Enterprise OSINT (200+ modules)
  spiderfoot-real:
    container_name: data_achieve_scrapy_spiderfoot_real
    image: crivellarodiego/spiderfoot:latest
    command: ["sf.py", "-l", "0.0.0.0:5001"]
    expose:
      - "5001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5001 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - scrapy_internal

  spiderfoot:
    container_name: data_achieve_scrapy_spiderfoot
    build:
      context: ../../../configs/bridges/spiderfoot-bridge
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${SCRAPY_PIP_INDEX_URL:-https://pypi.org/simple}
    image: spiderfoot_bridge:latest
    environment:
      SF_UPSTREAM: http://data_achieve_scrapy_spiderfoot_real:5001
    expose:
      - "5001"
    restart: unless-stopped
    depends_on:
      spiderfoot-real:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/api/v1/scanlist', timeout=3)\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - scrapy_internal

  edge:
    container_name: data_achieve_scrapy_edge
    depends_on:
      api:
        condition: service_healthy
      console:
        condition: service_healthy
    expose:
      - "8080"
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./edge-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/platforms >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      scrapy_internal:
      lighthouse_ai_video_net:
        aliases:
          - data_achieve_scrapy_proxy

networks:
  scrapy_internal:
    name: data_achieve_scrapy_internal
    driver: bridge
  lighthouse_ai_video_net:
    external: true

volumes:
  scrapy_postgres_data:
    name: data_achieve_scrapy_postgres_data
  scrapy_export_data:
    name: data_achieve_scrapy_export_data
  browser_data:
    name: data_achieve_scrapy_browser_data
