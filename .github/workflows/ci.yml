name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: "Real API base URL for optional regression run"
        required: false
        default: "https://scrapy.lute-tlz-dddd.top"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  api:
    name: API Quality Gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install API dependencies
        run: uv sync --locked --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src tests

      - name: Pytest
        run: uv run pytest

      - name: Alembic head check
        run: uv run alembic heads

  web:
    name: Web Quality Gate
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_MOCK_API: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm -C apps/web lint

      - name: Vitest
        run: pnpm -C apps/web test

      - name: Next.js build
        run: pnpm -C apps/web build

      - name: Install Playwright Chromium
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: Playwright E2E
        run: pnpm -C apps/web test:e2e

  web-real-e2e:
    name: Web Real API E2E (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: Playwright Real API E2E
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url }}
          PLAYWRIGHT_REAL_API: "true"
          SCRAPY_DEMO_PASSWORD: ${{ secrets.SCRAPY_DEMO_PASSWORD }}
          SCRAPY_DEMO_EMAIL: ${{ secrets.SCRAPY_DEMO_EMAIL || 'owner@example.com' }}
        run: pnpm -C apps/web test:e2e:real
