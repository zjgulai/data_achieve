server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # quick-collect 是同步采集入口，部分端点（spiderfoot 全站扫描、aliens_eye
    # selfcheck/advanced）在慢网络上要跑几分钟到二十几分钟。精确匹配优先于下面的
    # /api/ 前缀，只给这条路径放宽；其余 API 仍是 300s。
    # 服务端的子进程预算要留在这条上限之内，否则会先被 nginx 掐断、拿不到结构化错误。
    location = /api/quick-collect {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1800s;
    }

    # ABI 上传的精确入口，只在这一条 location 放宽请求体上限。
    # 不能写在 server 级：那等于允许任何人向任意 /api/*（含未认证路径）
    # POST 210MB，可把 edge 磁盘打满。上限 210m 对应服务端 200MB/批的
    # 留白（multipart 边界与头部）。
    # proxy_request_buffering off：body 直接流给 API。开着会让 nginx 先把
    # 整个文件缓冲到容器可写层，一份上传占两份磁盘，还给 OOM 制造入口。
    location = /api/abi/uploads/content {
        client_max_body_size 210m;
        proxy_request_buffering off;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }

    # ── API 文档（2026-11-03 新增）────────────────────────────────
    # FastAPI 的 /docs 在 api:8000 根路径下，但 edge 的 location / 归 console。
    # 这里用精确匹配把 /api/docs 映射过去；Swagger UI 还要拉 openapi.json，
    # 一并映射，否则页面空白。
    location = /api/docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/redoc {
        proxy_pass http://api:8000/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }

    location = /mcp {
        return 308 https://$host/mcp/;
    }

    location ^~ /mcp/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
    }

    # apps/web（洞察工作台）挂在 /insight。前缀**保留**转发：Next 的
    # basePath 是构建期常量，产物里的路由与静态资源路径都以 /insight 开头，
    # 剥掉前缀会让 Next 404。
    #
    # 两条都要有，且都直接转发给 web，不能写补斜杠的 return 308：
    # Next 在 basePath 下把 /insight 与 /insight/ 视为同一路由，并对
    # /insight/ 回 308 /insight。这里若反过来把 /insight 308 到 /insight/，
    # 两边互为反向跳转，浏览器报重定向过多。
    #
    # 精确匹配 /insight 是因为前缀匹配 ^~ /insight/ 不带斜杠时匹配不上，
    # 裸路径会落到下面的 console。
    location = /insight {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        # 2026-11-03: 恢复真实登录。middleware 已改为 JWT 验签，
        # 边缘层注入的占位 Cookie 会失效并覆盖用户会话，故移除。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }

    location ^~ /insight/ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }

    # ── 功能导航页（2026-11-03 新增）──────────────────────────────
    # 静态页由 edge 容器直接服务，挂载自 ./nav/index.html
    location = /assets {
        absolute_redirect off;
        port_in_redirect off;
        server_name_in_redirect off;
        add_header Cache-Control "no-store" always;
        alias /etc/nginx/nav/index.html;
        default_type text/html;
    }

    # ── media-query：TikTok 素材检索（2026-11-02 新增）───────────────
    # 独立容器 media_query:8000，自带 Basic Auth，此处不再叠加鉴权。
    # 必须写在 location / 之前：前缀匹配取最长者，位置无关紧要，
    # 但放在 / 前更易读。前端静态页与其 API 同源，无需额外 rewrite。
    # 无尾斜杠时补一个相对重定向，避免 nginx 拼成 host:8080
    location = /media-query {
        # absolute_redirect off：否则 nginx 会用 listen 的 8080 拼成 host:8080
        absolute_redirect off;
        port_in_redirect off;
        server_name_in_redirect off;
        return 301 /media-query/;
    }

    location ^~ /media-query/ {
        proxy_pass http://media_query:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        # 大文件导出可能较慢，关闭缓冲以流式返回
        proxy_buffering off;
    }

    location / {
        proxy_pass http://console:3001;
        proxy_http_version 1.1;
        # 2026-11-03: 恢复真实登录。middleware 已改为 JWT 验签，
        # 边缘层注入的占位 Cookie 会失效并覆盖用户会话，故移除。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }
}
