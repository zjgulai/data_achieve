services:
  db:
    image: postgres:15
    container_name: data-intelligence-hub-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-data_intel}
      POSTGRES_USER: ${POSTGRES_USER:-data_intel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-data_intel} -d ${POSTGRES_DB:-data_intel}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
