name: data_achieve_scrapy

# 新服务器版本（192.168.204.230 内网 · 1TB /data 数据盘）
# 与 configs/deploy/scrapy/docker-compose.yml 的主要差异：
#   1. postgres/exports/browser_data 改为 bind mount 到 /data/scrapy/
#   2. CORS_ORIGINS 改为内网地址（按实际域名替换）
#   3. proxy_rotator 移除（新服务器暂不需要）

services:
  db:
    container_name: data_achieve_scrapy_db
    environment:
      POSTGRES_DB: ${SCRAPY_POSTGRES_DB:?SCRAPY_POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${SCRAPY_POSTGRES_PASSWORD:?SCRAPY_POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${SCRAPY_POSTGRES_USER:?SCRAPY_POSTGRES_USER is required}
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    image: postgres:16
    restart: unless-stopped
    # 数据持久化到 /data 数据盘（bind mount，非 Docker volume）
    volumes:
      - /data/scrapy/postgres:/var/lib/postgresql/data
    networks:
      - scrapy_internal

  export-init:
    command:
      [
        "sh",
        "-c",
        "mkdir -p /app/exports/datasets && chown -R app:app /app/exports",
      ]
    container_name: data_achieve_scrapy_export_init
    image: data_achieve_scrapy_api:latest
    networks:
      - scrapy_internal
    restart: "no"
    user: root
    volumes:
      - /data/scrapy/exports:/app/exports

  api:
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile
    container_name: data_achieve_scrapy_api
    depends_on:
      db:
        condition: service_healthy
      export-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      AUTH_COOKIE_SECURE: ${SCRAPY_AUTH_COOKIE_SECURE:-true}
      # 替换为新服务器的实际域名或内网地址
      CORS_ORIGINS: ${SCRAPY_CORS_ORIGINS:-'["http://192.168.204.230","https://scrapy.lute-tlz-dddd.top"]'}
      DATABASE_URL: postgresql+asyncpg://${SCRAPY_POSTGRES_USER:?SCRAPY_POSTGRES_USER is required}:${SCRAPY_POSTGRES_PASSWORD:?SCRAPY_POSTGRES_PASSWORD is required}@db:5432/${SCRAPY_POSTGRES_DB:?SCRAPY_POSTGRES_DB is required}
      JWT_SECRET: ${SCRAPY_JWT_SECRET:?SCRAPY_JWT_SECRET is required}
      DATASET_EXPORT_DIR: ${SCRAPY_DATASET_EXPORT_DIR:-/app/exports/datasets}
      LLM_PROVIDER: mock
      LOG_LEVEL: INFO
      SCHEDULER_ENABLED: ${SCRAPY_SCHEDULER_ENABLED:-true}
      SCHEDULER_POLL_INTERVAL_SECONDS: ${SCRAPY_SCHEDULER_POLL_INTERVAL_SECONDS:-60}
      SMTP_FROM: ${SCRAPY_SMTP_FROM:-}
      SMTP_HOST: ${SCRAPY_SMTP_HOST:-}
      SMTP_PASSWORD: ${SCRAPY_SMTP_PASSWORD:-}
      SMTP_PORT: ${SCRAPY_SMTP_PORT:-587}
      SMTP_USER: ${SCRAPY_SMTP_USER:-}
      TIKHUB_API_KEY: ${TIKHUB_API_KEY:-}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      ANYSEARCH_API_KEY: ${ANYSEARCH_API_KEY:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PLATFORM_CREDENTIAL_MASTER_KEY: ${PLATFORM_CREDENTIAL_MASTER_KEY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      # 代理轮换器（新服务器暂禁用，有需要再开启）
      PROXY_ROTATOR_URL: ${PROXY_ROTATOR_URL:-}
      PROXY_ROTATOR_ENABLED: ${PROXY_ROTATOR_ENABLED:-false}
      # OSINT 服务
      MAIGRET_URL: ${MAIGRET_URL:-http://maigret:5000}
      SPIDERFOOT_BASE_URL: ${SPIDERFOOT_BASE_URL:-http://spiderfoot:5001}
      SPIDERFOOT_TIMEOUT: ${SPIDERFOOT_TIMEOUT:-300}
      MEDIACRAWLER_BASE_URL: ${MEDIACRAWLER_BASE_URL:-http://mediacrawler-bridge:8080}
      SCRAPY_DEMO_PASSWORD: ${SCRAPY_DEMO_PASSWORD:-}
    expose:
      - "8000"
    volumes:
      - /data/scrapy/exports:/app/exports
      - /data/scrapy/browser_data:/app/browser_data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    image: data_achieve_scrapy_api:latest
    restart: unless-stopped
    networks:
      - scrapy_internal

  console:
    build:
      context: ../../..
      dockerfile: apps/scraper-console/Dockerfile
      args:
        # 替换为新服务器实际访问地址
        NEXT_PUBLIC_API_URL: ${SCRAPY_PUBLIC_URL:-http://192.168.204.230}
    container_name: data_achieve_scrapy_console
    image: data_achieve_scrapy_console:latest
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3001"
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/platforms').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - scrapy_internal

  # Maigret OSINT Service
  maigret:
    container_name: data_achieve_scrapy_maigret
    image: soxoj/maigret:latest
    command: ["--web", "5000"]
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - scrapy_internal

  # SpiderFoot OSINT Platform (real instance on internal port 5001)
  spiderfoot-real:
    container_name: data_achieve_scrapy_spiderfoot_real
    image: crivellarodiego/spiderfoot:latest
    command: ["sf.py", "-l", "0.0.0.0:5001"]
    expose:
      - "5001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5001 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - scrapy_internal

  # SpiderFoot API Bridge — exposes /api/v1/ REST over SpiderFoot web UI
  spiderfoot:
    container_name: data_achieve_scrapy_spiderfoot
    build:
      context: ../../../configs/bridges/spiderfoot-bridge
      dockerfile: Dockerfile
    image: spiderfoot_bridge:latest
    environment:
      SF_UPSTREAM: http://data_achieve_scrapy_spiderfoot_real:5001
    expose:
      - "5001"
    restart: unless-stopped
    depends_on:
      spiderfoot-real:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/api/v1/scanlist', timeout=3)\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - scrapy_internal

  # MediaCrawler B站/微博/知乎/快手 (cookies required for actual data)
  mediacrawler:
    container_name: data_achieve_scrapy_mediacrawler
    image: bllxk/mediacrawler-api:latest
    expose:
      - "8001"
    restart: unless-stopped
    environment:
      BILIBILI_COOKIES: ${BILIBILI_COOKIES:-}
      WEIBO_COOKIES: ${WEIBO_COOKIES:-}
      ZHIHU_COOKIES: ${ZHIHU_COOKIES:-}
      KUAISHOU_COOKIES: ${KUAISHOU_COOKIES:-}
    networks:
      - scrapy_internal

  # MediaCrawler Bridge — translates /bilibili/* routes to mediacrawler-api format
  mediacrawler-bridge:
    container_name: data_achieve_scrapy_mc_bridge
    build:
      context: ../../../configs/bridges/mediacrawler-bridge
      dockerfile: Dockerfile
    image: mediacrawler_bridge:latest
    environment:
      MC_UPSTREAM: http://data_achieve_scrapy_mediacrawler:8001
    expose:
      - "8080"
    restart: unless-stopped
    depends_on:
      mediacrawler:
        condition: service_started
    networks:
      - scrapy_internal

  # Nginx 边缘代理（内部）
  edge:
    container_name: data_achieve_scrapy_edge
    depends_on:
      api:
        condition: service_healthy
      console:
        condition: service_healthy
    ports:
      # 新服务器：直接暴露端口到宿主机（宿主机 Nginx 再反代）
      - "8080:8080"
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./edge-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/platforms >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - scrapy_internal

networks:
  scrapy_internal:
    name: data_achieve_scrapy_internal
    driver: bridge
