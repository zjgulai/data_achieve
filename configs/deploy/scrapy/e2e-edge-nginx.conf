# 一次性真实链路 E2E 栈的 edge 反向代理。见 ADR-008。
#
# 与生产 edge 同拓扑：/api 转 api，其余转 web。
# 唯一区别是生产把 web 挂在 /insight，这里挂在根。
#
# 为什么必须走 edge 而不是让浏览器直连 3000 与 8000：
# 真实登录靠 Cookie。跨源时 SameSite=Lax 的 Cookie 不会随 fetch 发送，
# 登录会在浏览器侧静默失败。同源是这条门禁成立的前提。

server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 上传体积沿用生产的保守值。门禁用不到大文件。
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        # 栈内是 http，但应用需要知道外部真实协议时才用得上。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }
}
