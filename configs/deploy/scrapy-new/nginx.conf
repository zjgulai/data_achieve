# 宿主机 Nginx 配置 — 新服务器（192.168.204.230）
# 路径：/etc/nginx/sites-available/scrapy
# 将 80/443 端口反代到 Docker edge 容器的 8080 端口
#
# 安装：
#   sudo cp nginx.conf /etc/nginx/sites-available/scrapy
#   sudo ln -sf /etc/nginx/sites-available/scrapy /etc/nginx/sites-enabled/scrapy
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP → 直接服务（内网无需强制 HTTPS，如有域名可加 SSL 配置）
server {
    listen 80;
    # 若绑定了域名，替换 _ 为实际域名，例如：scrapy.internal.luteos.site
    server_name _;

    access_log /var/log/nginx/scrapy_access.log;
    error_log  /var/log/nginx/scrapy_error.log;

    # 上传/响应体大小限制（采集场景可能有大 payload）
    client_max_body_size 50m;

    # 反代到 Docker edge 容器
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout    300s;
        proxy_connect_timeout  30s;
        proxy_send_timeout    300s;
    }
}

