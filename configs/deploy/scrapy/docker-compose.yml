name: data_achieve_scrapy

services:
  db:
    container_name: data_achieve_scrapy_db
    environment:
      POSTGRES_DB: ${SCRAPY_POSTGRES_DB:-data_intel}
      POSTGRES_PASSWORD: ${SCRAPY_POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_USER: ${SCRAPY_POSTGRES_USER:-data_intel}
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    image: postgres:16
    restart: unless-stopped
    volumes:
      - scrapy_postgres_data:/var/lib/postgresql/data
    networks:
      - scrapy_internal

  api:
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile
    container_name: data_achieve_scrapy_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      AUTH_COOKIE_SECURE: ${SCRAPY_AUTH_COOKIE_SECURE:-true}
      CORS_ORIGINS: https://scrapy.lute-tlz-dddd.top
      DATABASE_URL: postgresql+asyncpg://${SCRAPY_POSTGRES_USER:-data_intel}:${SCRAPY_POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${SCRAPY_POSTGRES_DB:-data_intel}
      JWT_SECRET: ${SCRAPY_JWT_SECRET:-change-me-change-me-local-only}
      LLM_PROVIDER: mock
      LOG_LEVEL: INFO
      SCHEDULER_ENABLED: "false"
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    image: data_achieve_scrapy_api:latest
    restart: unless-stopped
    networks:
      - scrapy_internal

  web:
    build:
      context: ../../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://scrapy.lute-tlz-dddd.top
        NEXT_PUBLIC_MOCK_API: "false"
    container_name: data_achieve_scrapy_web
    image: data_achieve_scrapy_web:latest
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/tasks').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - scrapy_internal

  edge:
    container_name: data_achieve_scrapy_edge
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    expose:
      - "8080"
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./edge-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/tasks >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      scrapy_internal:
      lighthouse_ai_video_net:
        aliases:
          - data_achieve_scrapy_proxy

networks:
  scrapy_internal:
    name: data_achieve_scrapy_internal
    driver: bridge
  lighthouse_ai_video_net:
    external: true

volumes:
  scrapy_postgres_data:
    name: data_achieve_scrapy_postgres_data
