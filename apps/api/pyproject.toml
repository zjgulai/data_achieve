[project]
name = "data-intelligence-hub-api"
version = "0.1.0"
description = "FastAPI backend for Data Intelligence Hub."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "autoscraper>=1.1.14",
    "markitdown[all]>=0.1.0",
    "openpyxl>=3.1.0",
    "asyncpg>=0.30.0",
    "bcrypt>=4.0,<4.1",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "aliens-eye==2.7.0",
    "beautifulsoup4>=4.12.0",
    "httpx[socks]>=0.28.0",
    "maigret>=0.4.4",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "sherlock-project>=0.16.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4.0",
    "twscrape>=0.17.0",
    "uvicorn[standard]>=0.32.0",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.49.0",
]
social-youtube = [
    "google-api-python-client>=2.198.0",
]
social-reddit = [
    "asyncpraw>=8.0.2",
]
social-overseas-live = [
    "google-api-python-client>=2.198.0",
    "asyncpraw>=8.0.2",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_intelligence_hub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jose.*", "passlib.*"]
ignore_missing_imports = true

# 测试目录不强制函数注解。
#
# 理由：strict 下 no-untyped-def 在 tests 里累计 610 条，src 只有 5 条。
# 逐个给测试函数补注解不产生实际收益——测试的价值在断言，不在签名；
# 而 610 条噪音会把真正的回归淹掉（2026-10-28 实测全量 1544 条诊断）。
# src 仍保持 strict，所以生产代码的类型强度不受影响。
#
# 只放宽这一条，其余错误码（arg-type、call-overload、attr-defined 等）在
# tests 里仍然计入基线。
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
